name: Deploy to Google Cloud Run

on:
  push:
    branches: [main]
    paths: ['src/**', 'requirements.txt', 'Dockerfile']
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: blood-optimization-api
  REGION: us-central1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Test API startup
      run: |
        python -c "from src.api.main import app; print('✅ API imports successfully')"
        
    - name: Test algorithm basic
      run: |
        python -c "
        from src.algorithms.eoq_optimizer import BloodEOQOptimizer
        from src.utils.data_models import StockData, BloodType
        
        optimizer = BloodEOQOptimizer()
        test_stock = StockData(
            blood_type=BloodType.A_POS,
            current_stock=100,
            daily_usage_avg=10.0,
            expiration_days=35,
            cost_per_unit=75.0,
            collection_rate=1.2
        )
        
        result = optimizer.calculate_basic_eoq(test_stock)
        assert 'eoq_classic' in result
        print('✅ Algorithm test passed')
        "

  build-and-test-docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build Docker image
      run: |
        docker build -t blood-optimization-test .
        
    - name: Test Docker container
      run: |
        # Démarrer container en background
        docker run -d -p 8080:8080 --name test-container blood-optimization-test
        
        # Attendre que le service démarre
        sleep 15
        
        # Test health check
        curl -f http://localhost:8080/health || exit 1
        echo "✅ Health check passed"
        
        # Test root endpoint
        curl -f http://localhost:8080/ || exit 1
        echo "✅ Root endpoint passed"
        
        # Cleanup
        docker stop test-container
        docker rm test-container

  deploy:
    needs: [test, build-and-test-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true
        
    - name: Configure Docker for GCP
      run: gcloud auth configure-docker
      
    - name: Build and push Docker image
      run: |
        IMAGE_NAME="gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA"
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME
        echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
        
    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image $IMAGE_NAME \
          --platform managed \
          --region $REGION \
          --allow-unauthenticated \
          --memory=1Gi \
          --cpu=1 \
          --timeout=300 \
          --max-instances=5 \
          --set-env-vars="ENVIRONMENT=production"
          
    - name: Get service URL
      run: |
        SERVICE_URL=$(gcloud run services describe $SERVICE_NAME \
          --platform managed \
          --region $REGION \
          --format 'value(status.url)')
        echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_ENV
        echo "🚀 Service deployed at: $SERVICE_URL"
        
    - name: Verify deployment
      run: |
        sleep 30
        curl -f $SERVICE_URL/health || exit 1
        echo "✅ Deployment verification passed"
        echo "🎉 API available at: $SERVICE_URL"